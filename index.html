<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Taberna de Rol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #2a0f4d;
    --c2: #5b2a9e;
    --c3: #8f5bd6;
    --c4: #c9a8f0;
    --c5: #e8d6ff;
    --cream: #f1e3c2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: var(--c1);
    display: grid;
    place-items: center;
    font-family: "Almendra", Georgia, "Times New Roman", serif;
    color: var(--cream);
  }

  /* ---------- Fondo animado ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(120deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c2), var(--c1));
    background-size: 400% 400%;
    animation: shift 22s ease-in-out infinite;
  }
  .blob {
    position: fixed; z-index: 0;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .55;
    will-change: transform;
  }
  .b1 { width: 55vmax; height: 55vmax; left: -15vmax; top: -15vmax; background: #b58cf0; animation: drift1 26s ease-in-out infinite; }
  .b2 { width: 48vmax; height: 48vmax; right: -14vmax; top: 10vh;   background: #6a2fc2; animation: drift2 31s ease-in-out infinite; }
  .b3 { width: 42vmax; height: 42vmax; left: 10vw; bottom: -18vmax; background: #e2c8ff; opacity: .4; animation: drift3 29s ease-in-out infinite; }
  .b4 { width: 34vmax; height: 34vmax; right: 8vw; bottom: -10vmax; background: #3b1478; animation: drift1 37s ease-in-out infinite reverse; }

  @keyframes shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(18vw,12vh) scale(1.15); } 66% { transform: translate(6vw,26vh) scale(.9); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 40% { transform: translate(-22vw,14vh) scale(1.2); } 75% { transform: translate(-8vw,-10vh) scale(.92); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24vw,-16vh) scale(1.18); } }

  /* ---------- Contenido ---------- */
  main {
    position: relative; z-index: 1;
    width: 100%;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(18px, 4vh, 40px);
  }

  .stage {
    position: relative;
    width: min(78vw, 640px);
    perspective: 900px;
  }

  .logo-link {
    display: block;
    position: relative;
    border-radius: 24px;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .logo-link:focus-visible { outline: 3px solid var(--cream); outline-offset: 10px; }

  /* flotación suave en reposo */
  .float {
    animation: bob 6s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }

  /* capa que se despega y se inclina con el mouse */
  .tilt {
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.9,.25,1.2), filter .45s ease;
    filter: drop-shadow(0 14px 14px rgba(20, 4, 48, .45));
    will-change: transform;
  }
  .logo-link.lifted .tilt {
    transition: transform .12s linear, filter .35s ease;
    filter: drop-shadow(0 46px 38px rgba(14, 2, 38, .55));
  }
  .tilt img {
    display: block;
    width: 100%; height: auto;
    user-select: none; -webkit-user-drag: none;
  }

  /* sombra en el piso: se achica y difumina al despegarse */
  .shadow {
    position: absolute;
    left: 50%; bottom: -26px;
    width: 70%; height: 26px;
    transform: translateX(-50%) scale(1);
    background: radial-gradient(ellipse at center, rgba(14,2,38,.5), rgba(14,2,38,0) 70%);
    transition: transform .45s ease, opacity .45s ease;
    pointer-events: none;
  }
  .stage:has(.logo-link.lifted) .shadow { transform: translateX(-50%) scale(.72); opacity: .55; }

  .soon {
    font-size: clamp(1.6rem, 5.2vw, 2.8rem);
    letter-spacing: .28em;
    padding-left: .28em; /* compensa el tracking para centrar */
    color: var(--cream);
    text-shadow: 0 2px 0 rgba(30, 8, 60, .65), 0 6px 24px rgba(30, 8, 60, .55);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .bg, .blob, .float { animation: none; }
    .tilt, .logo-link.lifted .tilt { transition: none; }
  }
</style>
</head>

<script>
(function () {
  var link = document.getElementById('logo');
  var tilt = document.getElementById('tilt');
  var MAX = 14; // grados máx. de inclinación
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function lift(e) {
    if (reduce) return;
    var r = link.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width - 0.5;   // -0.5 .. 0.5
    var y = (e.clientY - r.top) / r.height - 0.5;
    link.classList.add('lifted');
    tilt.style.transform =
      'translateY(-26px) scale(1.09) rotateX(' + (-y * MAX) + 'deg) rotateY(' + (x * MAX) + 'deg) rotateZ(' + (x * 2) + 'deg)';
  }
  function drop() {
    link.classList.remove('lifted');
    tilt.style.transform = '';
  }

  link.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') lift(e); });
  link.addEventListener('pointermove',  function (e) { if (e.pointerType === 'mouse') lift(e); });
  link.addEventListener('pointerleave', drop);
  link.addEventListener('focus', function () {
    if (reduce) return;
    link.classList.add('lifted');
    tilt.style.transform = 'translateY(-26px) scale(1.09)';
  });
  link.addEventListener('blur', drop);
})();
</script>
